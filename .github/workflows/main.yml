name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  FAIL_ON_TEST_FAILURE: "true"
  TERM: "dumb"
  GRADLE_OPTS: "-Dorg.gradle.console=plain -Dkotlin.colors.enabled=false"

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Explicitly omit the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Verify build environment
        shell: bash
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail

          ./gradlew clean assembleDebug \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-daemon \
            2>&1 | tee gradle-build.log

          BUILD_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          # Remove ANSI control sequences so compiler diagnostics are searchable.
          sed -E \
            's/\x1B(\[[0-9;?]*[ -\/]*[@-~]|\][^\a]*(\a|\x1B\\))//g' \
            gradle-build.log > gradle-build-clean.log || \
            cp gradle-build.log gradle-build-clean.log

          if [[ "$BUILD_EXIT" -ne 0 ]]; then
            echo
            echo "========== Kotlin/compiler diagnostics =========="

            grep -nEi \
              '(^|[[:space:]])(e:|error:)[[:space:]]|file:/{2,3}.*\.kt(:|\()|\.kt:[0-9]+|\.kt \([0-9]+|unresolved reference|type mismatch|cannot infer|no value passed|too many arguments|conflicting overloads|overload resolution ambiguity|expecting (an element|expression|member declaration)|redeclaration|unresolved supertypes|cannot access|is not abstract and does not implement|none of the following candidates' \
              gradle-build-clean.log | head -n 300 || true

            echo
            echo "========== Failed task and surrounding context =========="

            grep -nEi -B 20 -A 80 \
              'execution failed for task|compilation error|what went wrong|failure: build failed with an exception' \
              gradle-build-clean.log | head -n 500 || true
          fi

          exit "$BUILD_EXIT"

      - name: Run unit tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail

          ./gradlew testDebugUnitTest \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-daemon \
            2>&1 | tee gradle-tests.log

          TEST_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"

          sed -E \
            's/\x1B(\[[0-9;?]*[ -\/]*[@-~]|\][^\a]*(\a|\x1B\\))//g' \
            gradle-tests.log > gradle-tests-clean.log || \
            cp gradle-tests.log gradle-tests-clean.log

          exit "$TEST_EXIT"

      - name: Create Gradle failure report
        if: always() && (steps.build.outcome == 'failure' || steps.tests.outcome == 'failure')
        shell: bash
        run: |
          REPORT="gradle-failure-report.txt"
          : > "$REPORT"

          for LOG in gradle-build-clean.log gradle-tests-clean.log; do
            [[ -f "$LOG" ]] || continue

            {
              echo "============================================================"
              echo "Actionable compiler/build diagnostics from $LOG"
              echo "============================================================"
            } >> "$REPORT"

            grep -nEi \
              '(^|[[:space:]])(e:|error:)[[:space:]]|file:/{2,3}.*\.kt(:|\()|\.kt:[0-9]+|\.kt \([0-9]+|unresolved reference|type mismatch|cannot infer|no value passed|too many arguments|conflicting overloads|overload resolution ambiguity|expecting (an element|expression|member declaration)|redeclaration|unresolved supertypes|cannot access|is not abstract and does not implement|none of the following candidates|execution failed for task|what went wrong' \
              "$LOG" | head -n 500 >> "$REPORT" || true

            {
              echo
              echo "============================================================"
              echo "Context around the failed task in $LOG"
              echo "============================================================"
            } >> "$REPORT"

            grep -nEi -B 30 -A 120 \
              'execution failed for task|compilation error|what went wrong|failure: build failed with an exception' \
              "$LOG" | head -n 800 >> "$REPORT" || true

            {
              echo
              echo "============================================================"
              echo "First 250 lines of $LOG"
              echo "============================================================"
            } >> "$REPORT"
            head -n 250 "$LOG" >> "$REPORT" || true

            {
              echo
              echo "============================================================"
              echo "Final 250 lines of $LOG"
              echo "============================================================"
            } >> "$REPORT"
            tail -n 250 "$LOG" >> "$REPORT" || true
            echo >> "$REPORT"
          done

          echo "========== Actual Gradle failure details =========="
          cat "$REPORT"

      - name: Upload debug APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-build.log
            gradle-build-clean.log
            gradle-tests.log
            gradle-tests-clean.log
            gradle-failure-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail when APK build failed
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The Android debug APK build failed."

          if [[ -f gradle-failure-report.txt ]]; then
            echo
            echo "========== Actual Gradle failure details =========="
            cat gradle-failure-report.txt
          elif [[ -f gradle-build.log ]]; then
            tail -n 300 gradle-build.log
          fi

          exit 1

      - name: Fail when unit tests failed
        if: >-
          always() &&
          steps.build.outcome == 'success' &&
          steps.tests.outcome == 'failure' &&
          env.FAIL_ON_TEST_FAILURE == 'true'
        shell: bash
        run: |
          echo "::error::Android unit tests failed."

          if [[ -f gradle-failure-report.txt ]]; then
            cat gradle-failure-report.txt
          elif [[ -f gradle-tests.log ]]; then
            tail -n 300 gradle-tests.log
          fi

          exit 1
