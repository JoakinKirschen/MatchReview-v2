name: Android Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  FAIL_ON_TEST_FAILURE: "true"

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
          log-accepted-android-sdk-licenses: false

      - name: Print build environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build debug APK
        id: apk_build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee gradle-build.log

      - name: Run unit tests
        id: unit_tests
        if: steps.apk_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew \
            testDebugUnitTest \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee gradle-tests.log

      - name: Prepare Gradle failure report
        if: always() && (steps.apk_build.outcome == 'failure' || steps.unit_tests.outcome == 'failure')
        run: |
          {
            echo "Gradle failure report"
            echo "====================="
            echo

            found_log=false
            for log_file in gradle-build.log gradle-tests.log; do
              if [ -f "$log_file" ]; then
                found_log=true
                echo "===== ${log_file}: likely error lines ====="
                grep -nEi \
                  'FAILURE:|What went wrong:|Execution failed for task|Caused by:|Exception|^[[:space:]]*e: |^[[:space:]]*error:|Could not resolve|Could not find|Compilation error|A failure occurred|Manifest merger failed|Android resource linking failed|BUILD FAILED' \
                  "$log_file" | tail -n 250 || true
                echo
                echo "===== ${log_file}: final 300 lines ====="
                tail -n 300 "$log_file"
                echo
              fi
            done

            if [ "$found_log" = false ]; then
              echo "No Gradle log file was generated."
            fi
          } > gradle-failure-report.txt

          cat gradle-failure-report.txt

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-build.log
            gradle-tests.log
            gradle-failure-report.txt
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: steps.apk_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: matchreview-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## Android build outcome"
            echo
            echo "- APK build: \`${{ steps.apk_build.outcome }}\`"
            echo "- Unit tests: \`${{ steps.unit_tests.outcome }}\`"
            echo "- Java: \`${JAVA_VERSION}\`"
            echo "- Android API: \`${ANDROID_API_LEVEL}\`"
            echo "- Build Tools: \`${ANDROID_BUILD_TOOLS}\`"
            echo

            if [ "${{ steps.apk_build.outcome }}" = "failure" ]; then
              echo "❌ The debug APK build failed."
              echo
              echo "The **Print Gradle failure details** step contains the relevant error."
            elif [ "${{ steps.unit_tests.outcome }}" = "failure" ]; then
              echo "❌ The APK was built, but one or more unit tests failed."
              echo
              echo "The **Print Gradle failure details** step and test reports contain the failure."
            elif [ "${{ steps.apk_build.outcome }}" = "success" ]; then
              echo "✅ The debug APK build and unit-test task completed successfully."
            else
              echo "⚠️ The Gradle tasks did not complete normally."
            fi

            echo
            echo "Full logs and reports are available in the **gradle-diagnostics** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure and fail job
        if: >-
          always() &&
          (
            steps.apk_build.outcome == 'failure' ||
            (env.FAIL_ON_TEST_FAILURE == 'true' && steps.unit_tests.outcome == 'failure')
          )
        run: |
          echo "::group::Actual Gradle failure details"

          if [ -f gradle-failure-report.txt ]; then
            cat gradle-failure-report.txt
          elif [ -f gradle-build.log ]; then
            tail -n 300 gradle-build.log
          elif [ -f gradle-tests.log ]; then
            tail -n 300 gradle-tests.log
          else
            echo "No Gradle diagnostic log was generated."
          fi

          echo "::endgroup::"

          if [ "${{ steps.apk_build.outcome }}" = "failure" ]; then
            echo "::error title=Android APK build failed::Review the Gradle error printed immediately above or download the gradle-diagnostics artifact."
          else
            echo "::error title=Android unit tests failed::Review the test error printed immediately above or download the gradle-diagnostics artifact."
          fi

          exit 1
