name: Android Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  FAIL_ON_TEST_FAILURE: "true"

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
          log-accepted-android-sdk-licenses: false

      - name: Print build environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build debug APK and run tests
        id: gradle
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew \
            clean \
            assembleDebug \
            testDebugUnitTest \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee gradle-build.log

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-build.log
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: matchreview-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## Android build outcome"
            echo
            echo "- Gradle step: \`${{ steps.gradle.outcome }}\`"
            echo "- Java: \`${JAVA_VERSION}\`"
            echo "- Android API: \`${ANDROID_API_LEVEL}\`"
            echo "- Build Tools: \`${ANDROID_BUILD_TOOLS}\`"
            echo
            if [ "${{ steps.gradle.outcome }}" = "success" ]; then
              echo "The debug APK and test reports were generated successfully."
            else
              echo "The build failed. Download the **gradle-diagnostics** artifact and inspect:"
              echo
              echo '```text'
              echo "* What went wrong:"
              echo "Caused by:"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if Gradle failed
        if: steps.gradle.outcome == 'failure'
        run: |
          echo "::error::The Android debug APK build or unit-test task failed."
          exit 1
