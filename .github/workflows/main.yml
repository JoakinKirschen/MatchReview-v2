name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  FAIL_ON_TEST_FAILURE: "true"

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Explicitly omit the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Verify build environment
        shell: bash
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-daemon \
            2>&1 | tee gradle-build.log

      - name: Run unit tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest \
            --console=plain \
            --stacktrace \
            --warning-mode all \
            --no-daemon \
            2>&1 | tee gradle-tests.log

      - name: Create Gradle failure report
        if: always() && (steps.build.outcome == 'failure' || steps.tests.outcome == 'failure')
        shell: bash
        run: |
          REPORT="gradle-failure-report.txt"
          : > "$REPORT"

          for LOG in gradle-build.log gradle-tests.log; do
            if [[ ! -f "$LOG" ]]; then
              continue
            fi

            {
              echo "============================================================"
              echo "Compiler errors found in $LOG"
              echo "============================================================"
            } >> "$REPORT"

            grep -nEi \
              '(^|[[:space:]])e: |\.kt:[0-9]+|error:|unresolved reference|type mismatch|cannot infer|no value passed|too many arguments|conflicting overloads|execution failed for task|what went wrong' \
              "$LOG" >> "$REPORT" || true

            {
              echo
              echo "============================================================"
              echo "Final 300 lines of $LOG"
              echo "============================================================"
            } >> "$REPORT"

            tail -n 300 "$LOG" >> "$REPORT" || true
            echo >> "$REPORT"
          done

          echo "Actual Gradle failure details"
          cat "$REPORT"

      - name: Upload debug APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          path: |
            gradle-build.log
            gradle-tests.log
            gradle-failure-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail when APK build failed
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The Android debug APK build failed."

          if [[ -f gradle-failure-report.txt ]]; then
            echo
            echo "========== Actual Gradle failure details =========="
            cat gradle-failure-report.txt
          elif [[ -f gradle-build.log ]]; then
            tail -n 300 gradle-build.log
          fi

          exit 1

      - name: Fail when unit tests failed
        if: >-
          always() &&
          steps.build.outcome == 'success' &&
          steps.tests.outcome == 'failure' &&
          env.FAIL_ON_TEST_FAILURE == 'true'
        shell: bash
        run: |
          echo "::error::Android unit tests failed."

          if [[ -f gradle-failure-report.txt ]]; then
            cat gradle-failure-report.txt
          elif [[ -f gradle-tests.log ]]; then
            tail -n 300 gradle-tests.log
          fi

          exit 1
