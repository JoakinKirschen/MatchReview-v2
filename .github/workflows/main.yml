name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  # Unit-test failures fail the workflow; the APK and reports are still uploaded first.
  FAIL_ON_TEST_FAILURE: "true"
  TERM: "dumb"
  GRADLE_OPTS: "-Dorg.gradle.console=plain -Dkotlin.colors.enabled=false"

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Verify build environment
        shell: bash
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      # Capture Gradle output instead of streaming a long stack trace. If the
      # build fails, the next step prints compiler messages as the final output.

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e

          ./gradlew clean assembleDebug \
            --console=plain \
            --warning-mode all \
            --no-daemon \
            > gradle-build.log 2>&1

          BUILD_EXIT=$?
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          # Strip ANSI escape sequences.
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("gradle-build.log")
          text = source.read_text(encoding="utf-8", errors="replace")
          ansi = re.compile(r"\x1B(?:[@-_][0-?]*[ -/]*[@-~]|\][^\x07]*(?:\x07|\x1B\\))")
          Path("gradle-build-clean.log").write_text(
              ansi.sub("", text),
              encoding="utf-8",
          )
          PY

          if [[ "$BUILD_EXIT" -eq 0 ]]; then
            cat gradle-build-clean.log
          fi

          exit "$BUILD_EXIT"

      - name: Extract Kotlin and Gradle errors
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          log_path = Path("gradle-build-clean.log")
          report_path = Path("compiler-errors.txt")

          if not log_path.exists():
              report_path.write_text(
                  "gradle-build-clean.log was not created.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          lines = log_path.read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines()

          patterns = [
              re.compile(r"^\s*e:\s+", re.I),
              re.compile(r"^\s*error:\s+", re.I),
              re.compile(r"\.kts?(?::|\()[0-9]+", re.I),
              re.compile(r"\b(unresolved reference|type mismatch|cannot infer)\b", re.I),
              re.compile(r"\b(no value passed|too many arguments)\b", re.I),
              re.compile(r"\b(conflicting overloads|overload resolution ambiguity)\b", re.I),
              re.compile(r"\b(expecting .+|redeclaration|unresolved supertypes)\b", re.I),
              re.compile(r"\b(cannot access|does not implement|none of the following candidates)\b", re.I),
              re.compile(r"Android resource linking failed", re.I),
              re.compile(r"Manifest merger failed", re.I),
              re.compile(r"Execution failed for task", re.I),
              re.compile(r"Could not resolve (all files|all dependencies)", re.I),
              re.compile(r"Could not find .+:", re.I),
              re.compile(r"FAILURE: Build failed with an exception", re.I),
              re.compile(r"^\s*\* What went wrong:", re.I),
          ]

          selected = set()
          for index, line in enumerate(lines):
              if any(pattern.search(line) for pattern in patterns):
                  # Include nearby lines because Kotlin sometimes wraps messages.
                  for nearby in range(max(0, index - 2), min(len(lines), index + 5)):
                      selected.add(nearby)

          output = [
              "============================================================",
              "ACTIONABLE KOTLIN / GRADLE ERRORS",
              "============================================================",
          ]

          if selected:
              previous = None
              for index in sorted(selected):
                  if previous is not None and index > previous + 1:
                      output.append("--")
                  output.append(f"{index + 1}: {lines[index]}")
                  previous = index
          else:
              output.extend([
                  "No source-level compiler line was detected automatically.",
                  "The final 200 lines of the Gradle log follow:",
                  "------------------------------------------------------------",
                  *lines[-200:],
              ])

          report_path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

          cat compiler-errors.txt

          {
            echo "## Android build failed"
            echo
            echo '```text'
            head -n 300 compiler-errors.txt
            echo '```'
            echo
            echo "Download the **gradle-diagnostics** artifact for the full log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          ./gradlew testDebugUnitTest \
            --console=plain \
            --warning-mode all \
            --no-daemon \
            > gradle-tests.log 2>&1

          TEST_EXIT=$?
          echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("gradle-tests.log")
          text = source.read_text(encoding="utf-8", errors="replace")
          ansi = re.compile(r"\x1B(?:[@-_][0-?]*[ -/]*[@-~]|\][^\x07]*(?:\x07|\x1B\\))")
          Path("gradle-tests-clean.log").write_text(
              ansi.sub("", text),
              encoding="utf-8",
          )
          PY

          if [[ "$TEST_EXIT" -eq 0 ]]; then
            cat gradle-tests-clean.log
          fi

          exit "$TEST_EXIT"

      - name: Print unit-test failure
        if: always() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          echo "========== UNIT-TEST FAILURE =========="
          if [[ -f gradle-tests-clean.log ]]; then
            grep -nEi -B 10 -A 40 \
              'failed|failure|assertion|expected|exception|execution failed for task' \
              gradle-tests-clean.log | head -n 400 || true
            echo
            echo "========== FINAL 150 TEST LOG LINES =========="
            tail -n 150 gradle-tests-clean.log
          fi

      - name: Summarize unit-test result
        if: always() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Android unit tests"
            echo
            echo "⚠️ Unit tests failed. Failed tests:"
            echo
            python3 - <<'PY' || true
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      name = case.get("classname", "").rsplit(".", 1)[-1]
                      print(f"- `{name}.{case.get('name')}`")
          PY
            echo
            echo "Download the **android-test-reports** artifact for the HTML and XML reports."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Android unit tests failed. See the job summary for the failing tests."

      - name: Upload debug APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-diagnostics
          path: |
            gradle-build.log
            gradle-build-clean.log
            compiler-errors.txt
            gradle-tests.log
            gradle-tests-clean.log
            app/schemas/
          if-no-files-found: ignore
          retention-days: 14

      # Room writes the schema of every database version to app/schemas during the build.
      # The committed files document each version and must match the entities.
      - name: Check Room schemas are committed
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          changed="$(git status --porcelain --untracked-files=all -- app/schemas)"
          if [[ -z "$changed" ]]; then
            echo "Room schemas match the committed files."
            exit 0
          fi
          echo "::error::Room schema files are missing or out of date. Commit the files under app/schemas."
          echo "$changed"
          git status --porcelain --untracked-files=all -- app/schemas | awk '{print $2}' | while read -r file; do
            echo "===== BEGIN $file ====="
            cat "$file"
            echo "===== END $file ====="
          done
          exit 1

      # Keep the concise compiler report at the very end of the failed job.
      - name: Fail when APK build failed
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::The Android debug APK build failed."
          echo
          if [[ -f compiler-errors.txt ]]; then
            cat compiler-errors.txt
          else
            echo "Compiler report is unavailable."
            [[ -f gradle-build-clean.log ]] && tail -n 200 gradle-build-clean.log
          fi
          exit 1

      - name: Fail when unit tests failed
        if: >-
          always() &&
          steps.build.outcome == 'success' &&
          steps.tests.outcome == 'failure' &&
          env.FAIL_ON_TEST_FAILURE == 'true'
        shell: bash
        run: |
          echo "::error::Android unit tests failed."
          [[ -f gradle-tests-clean.log ]] && tail -n 200 gradle-tests-clean.log
          exit 1
